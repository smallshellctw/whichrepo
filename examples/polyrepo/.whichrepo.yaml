version: 1
workspace:
  name: commerce-platform
  include: []
  exclude:
    - archive-*
    - tmp-*
index:
  database: ""
  max_files_per_project: 800
  max_bytes_per_file: 12288
  max_bytes_per_project: 4194304
  extra_extensions: []
routing:
  top_k: 8
  provider: local
  model: ""
  provider_url: ""
  provider_timeout: 20s
dashboard:
  listen: 127.0.0.1:8787
  open: false
privacy:
  additional_exclude_dirs: []
  additional_sensitive_files: []
projects:
  payments-api:
    path: services/payments-api
    description: Checkout, payment processing, and webhook endpoints
    aliases: [checkout, payments, webhooks, refunds, endpoint, currency, callbacks]
  webhook-worker:
    path: workers/webhook-worker
    description: Background processing and retry handling for webhook events
    aliases: [retry worker, webhook jobs, queue, consumer, job processor, dead letter]
  frontend-app:
    path: apps/frontend-app
    description: Customer checkout experience
    aliases: [checkout UI, frontend, customer screen, form, button, accessibility, localization]
  shared-libs:
    path: packages/shared-libs
    description: Shared schemas and retry utilities
    aliases: [shared retry, shared-contracts, shared_contracts, commerce/shared-libs, common types, schema, interfaces, utilities, enum]
  infra:
    path: infra
    description: Deployment and runtime configuration
    aliases: [kubernetes, deployment, replicas, autoscaling, resources, ingress, pod, secrets, image, readiness, staging]
  fraud-model:
    path: services/fraud-model
    description: Python fraud scoring and payment risk models
    aliases: [fraud, risk model, scoring, anomaly, python service]
  ledger-service:
    path: services/ledger-service
    description: Java ledger entries and payment reconciliation service
    aliases: [ledger, reconciliation, spring, maven, journal]
  event-router:
    path: services/event-router
    description: Rust event routing and delivery service
    aliases: [event bus, event routing, rust service, delivery]
  billing-api:
    path: services/billing-api
    description: .NET subscriptions, invoices, and billing API
    aliases: [billing, invoice, subscription, dotnet, csharp]
  catalog-service:
    path: services/catalog-service
    description: PHP product catalog and pricing service
    aliases: [catalog, pricing, products, composer, php service]
  notification-service:
    path: services/notification-service
    description: Ruby notification delivery and webhook alerts
    aliases: [notifications, email, alerts, ruby service, gem]
