name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    env:
      GOFLAGS: -tags=grammar_subset,grammar_subset_go,grammar_subset_javascript,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_python,grammar_subset_java,grammar_subset_rust,grammar_subset_c_sharp,grammar_subset_php,grammar_subset_ruby
      CGO_ENABLED: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/whichrepo
      - name: Standalone binary smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make build
          ./scripts/smoke-binary.sh ./bin/whichrepo
      - name: Standalone Windows binary smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o whichrepo-smoke.exe ./cmd/whichrepo
          $root = Join-Path $env:RUNNER_TEMP "whichrepo-smoke"
          $workspace = Join-Path $root "workspace"
          New-Item -ItemType Directory -Force -Path (Join-Path $workspace "payment-api") | Out-Null
          '{"name":"payment-api","version":"0.1.0"}' | Set-Content (Join-Path $workspace "payment-api/package.json")
          $env:WHICHREPO_DB = Join-Path $root "index.db"
          .\whichrepo-smoke.exe init $workspace | Out-Null
          .\whichrepo-smoke.exe config validate --workspace $workspace | Out-Null
          .\whichrepo-smoke.exe route --workspace $workspace "change payment API" | Out-Null
          .\whichrepo-smoke.exe doctor --workspace $workspace | Out-Null
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:sites
        working-directory: web
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Build release matrix
        shell: bash
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -tags=grammar_subset,grammar_subset_go,grammar_subset_javascript,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_python,grammar_subset_java,grammar_subset_rust,grammar_subset_c_sharp,grammar_subset_php,grammar_subset_ruby -o /tmp/whichrepo-${target//\//-} ./cmd/whichrepo
          done
